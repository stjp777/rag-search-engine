[project]
name = "rag-search-engine"
version = "0.1.0"
description = "Keyword, semantic and hybrid search with optional LLM reranking and answer generation, over any JSON dataset."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "nltk==3.9.1",
    "numpy==2.3.3",
    "openai==2.44.0",
    "pillow>=13.0.0",
    "python-dotenv==1.1.0",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag-search = "rag_search.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines are prompt text
